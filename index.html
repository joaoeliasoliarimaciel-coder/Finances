<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro da Princesa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <main class="container">
    <h1>Controle Financeiro</h1>
    
    <form id="transactionForm">
      <div class="form-group">
        <label for="description">Descrição:</label>
        <input type="text" id="description" placeholder="Ex: Salário, Padaria..." required>
      </div>

      <div class="form-group">
        <label for="type">Tipo de Movimentação:</label>
        <select id="type" required>
          <option value="income">Receita (Feliz)</option>
          <option value="expense">Despesa (Triste)</option>
        </select>
      </div>

      <button type="submit">Adicionar Movimentação</button>
    </form>
  </main>

  <!-- Contêiner onde a princesa vai aparecer -->
  <div id="princess-container"></div>

  <script src="app.js"></script>
</body>
</html>
